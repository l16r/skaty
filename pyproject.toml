[project]
name = "skaty"
version = "0.1.0"
description = "An extensible Skat implementation with reference implementation for International Skat Order"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luis M. Lindner", email = "luis@l16r.com" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.poetry]
packages = [{ include = "skaty", from = "src" }]

[tool.poetry.group.test.dependencies]
pytest = "^8.4.1"
pytest-cov = "^7.0.0"

[tool.poetry.group.dev.dependencies]
mypy = "^1.17.1"
mkdocs = "^1.6.1"
mkdocstrings = {extras = ["python"], version = "^1.0.3"}
mkdocs-material = "^9.7.6"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
